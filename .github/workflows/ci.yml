name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compose-validate:
    name: compose validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Prepare stub env and placeholder files
        run: |
          cp compose/services.env.example compose/.env
          touch compose/netbird/config.yaml compose/netbird/dashboard.env

      - name: Validate edge stack
        run: docker compose -f compose/docker-compose.yml config -q

      - name: Validate netbird stack
        run: docker compose -f compose/netbird/docker-compose.yml config -q

  caddy-check:
    name: caddy fmt + validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: caddy fmt --diff
        run: |
          docker run --rm \
            -v "$PWD/compose/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy fmt --diff /etc/caddy/Caddyfile

      - name: Build custom Caddy image
        run: docker build -t caddy-custom compose/

      - name: caddy validate
        run: |
          docker run --rm \
            -v "$PWD/compose/Caddyfile:/etc/caddy/Caddyfile:ro" \
            --env-file compose/services.env.example \
            caddy-custom caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Run gitleaks
        run: ./gitleaks detect --source=. --no-banner --redact
