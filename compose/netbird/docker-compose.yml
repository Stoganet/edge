services:
  # UI dashboard
  dashboard:
    image: netbirdio/dashboard:latest@sha256:9f9d619245eeaeea4675960c86e24187079dbf329a652f36532cf065b2c4a97e
    container_name: netbird-dashboard
    restart: unless-stopped
    networks: [netbird, proxy-net]
    ports:
      - '127.0.0.1:8080:80'
    env_file:
      - ./dashboard.env
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "2"

  # Combined server (Management + Signal + Relay + STUN)
  netbird-server:
    image: netbirdio/netbird-server:latest@sha256:f0317a42ceeed4ea14c393bd975c2e801517e33efb0d5ace4258d8dcfdbe0689
    container_name: netbird-server
    restart: unless-stopped
    networks: [netbird, proxy-net]
    ports:
      - '127.0.0.1:8081:80'
      - '3478:3478/udp'
    volumes:
      - netbird_data:/var/lib/netbird
      - ./config.yaml:/etc/netbird/config.yaml
    command: ["--config", "/etc/netbird/config.yaml"]
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "2"

volumes:
  netbird_data:

networks:
  netbird:
  proxy-net:
    external: true
