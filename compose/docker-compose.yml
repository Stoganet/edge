services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    env_file: .env
    mem_limit: 256m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /var/log/caddy:/var/log/caddy
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true

volumes:
  caddy_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/caddy_data
  caddy_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/caddy_config
